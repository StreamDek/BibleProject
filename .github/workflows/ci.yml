name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-and-backend:
    name: Shared logic, pipeline and backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -Pbible.android=false :shared:core-model:jvmTest :shared:feed-engine:jvmTest :shared:bible-data:jvmTest :shared:stories:jvmTest :pipeline:test :backend:test --console=plain
      - name: Check the bundled KJV database is up to date
        run: |
          ./gradlew -Pbible.android=false :pipeline:importKjv --console=plain
          git diff --exit-code -- shared/feed-engine/src/jvmTest/resources/kjv-units.tsv composeApp/src/commonMain/composeResources/files/bible-kjv.stamp
      - name: Check the bundled story catalogue is up to date
        run: |
          ./gradlew -Pbible.android=false :pipeline:buildStories --console=plain
          git diff --exit-code -- composeApp/src/commonMain/composeResources/files/stories.json
      - name: Check the bundled study pack is up to date
        run: |
          ./gradlew -Pbible.android=false :pipeline:buildStudy --console=plain
          git diff --exit-code -- composeApp/src/commonMain/composeResources/files/study.stamp content/study/import-report.md

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :androidApp:assembleDebug :composeApp:compileKotlinDesktop --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: bible-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14

  ios:
    name: iOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -Pbible.android=false :shared:core-model:iosSimulatorArm64Test :shared:feed-engine:iosSimulatorArm64Test :shared:stories:iosSimulatorArm64Test --console=plain
      - run: brew install xcodegen
      - name: Build for the iOS simulator
        working-directory: iosApp
        run: |
          xcodegen
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -50

  backend-image:
    name: Publish API image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: shared-and-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -Pbible.android=false :backend:buildFatJar --console=plain
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/streamdek/bible-api:latest
            ghcr.io/streamdek/bible-api:${{ github.sha }}
